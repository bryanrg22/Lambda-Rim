<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" font-family="'DM Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect x="8" y="8" width="1384" height="934" rx="26" fill="#242220"/>
  <defs>
    <marker id="mGold" markerWidth="12" markerHeight="12" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#E8A838"/></marker>
    <marker id="mGray" markerWidth="12" markerHeight="12" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b0aaa0"/></marker>
    <marker id="mDash" markerWidth="12" markerHeight="12" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a948a"/></marker>
  </defs>

  <!-- ===== Group containers ===== -->
  <rect x="40" y="36" width="480" height="185" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <text x="64" y="70" font-size="24" font-weight="bold" fill="#c9c3b8">Browser</text>

  <rect x="1005" y="36" width="360" height="345" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <text x="1029" y="70" font-size="24" font-weight="bold" fill="#c9c3b8">External APIs</text>

  <rect x="40" y="250" width="935" height="510" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <text x="64" y="285" font-size="24" font-weight="bold" fill="#c9c3b8">Cloud (GCP us-west2)</text>

  <rect x="1005" y="420" width="360" height="340" rx="20" fill="#2e2b28" stroke="#4a463f" stroke-width="2"/>
  <text x="1029" y="454" font-size="24" font-weight="bold" fill="#c9c3b8">Local Mac (home IP)</text>

  <!-- ===== Component boxes ===== -->
  <!-- React SPA (entry / amber) -->
  <rect x="70" y="86" width="420" height="118" rx="14" fill="#B8842C"/>
  <text x="90" y="119" font-size="25" font-weight="bold" fill="#ffffff">React SPA Frontend</text>
  <text x="90" y="146" font-size="18" fill="#e6e0d6">React 18 + Vite 6 + Tailwind</text>
  <text x="90" y="168" font-size="18" fill="#e6e0d6">Firebase JS SDK — Auth + reads</text>
  <text x="90" y="190" font-size="18" fill="#e6e0d6">ScreenshotUploader OCR flow</text>

  <!-- Firebase Hosting (infra / purple) -->
  <rect x="70" y="305" width="410" height="118" rx="14" fill="#6D5BD8"/>
  <text x="90" y="338" font-size="25" font-weight="bold" fill="#ffffff">Firebase Hosting</text>
  <text x="90" y="365" font-size="18" fill="#e6e0d6">serves frontEnd/dist (SPA)</text>
  <text x="90" y="387" font-size="18" fill="#e6e0d6">/api/** → Cloud Run rewrite</text>
  <text x="90" y="409" font-size="18" fill="#e6e0d6">GitHub Actions deploy on merge</text>

  <!-- Flask API (app / green) -->
  <rect x="535" y="305" width="410" height="118" rx="14" fill="#0E9F7A"/>
  <text x="555" y="338" font-size="25" font-weight="bold" fill="#ffffff">Flask API — Cloud Run</text>
  <text x="555" y="365" font-size="18" fill="#e6e0d6">gunicorn :8080 · 2 workers · 120s</text>
  <text x="555" y="387" font-size="18" fill="#e6e0d6">/api/player, /api/parse_screenshot</text>
  <text x="555" y="409" font-size="18" fill="#e6e0d6">Poisson P(X≥t) + GARCH(1,1) vol</text>

  <!-- Firestore (infra / purple) -->
  <rect x="70" y="470" width="410" height="118" rx="14" fill="#6D5BD8"/>
  <text x="90" y="503" font-size="25" font-weight="bold" fill="#ffffff">Firestore</text>
  <text x="90" y="530" font-size="18" fill="#e6e0d6">processedPlayers/ picks + injuries</text>
  <text x="90" y="552" font-size="18" fill="#e6e0d6">users/{uid} activeBets, betHistory</text>
  <text x="90" y="574" font-size="18" fill="#e6e0d6">preproccessed_data/prizepicks</text>

  <!-- OCaml Monte Carlo (app / green) -->
  <rect x="535" y="470" width="410" height="118" rx="14" fill="#0E9F7A"/>
  <text x="555" y="503" font-size="25" font-weight="bold" fill="#ffffff">OCaml Monte Carlo (.so)</text>
  <text x="555" y="530" font-size="18" fill="#e6e0d6">montecarlo.ml Box–Muller draws</text>
  <text x="555" y="552" font-size="18" fill="#e6e0d6">mc_stub.c shim · OCaml 4.14</text>
  <text x="555" y="574" font-size="18" fill="#e6e0d6">100k sims over last 60 games</text>

  <!-- Injury Report Function (app / green) -->
  <rect x="70" y="640" width="390" height="94" rx="14" fill="#0E9F7A"/>
  <text x="90" y="673" font-size="25" font-weight="bold" fill="#ffffff">Injury Report Function</text>
  <text x="90" y="698" font-size="18" fill="#e6e0d6">gen2 python311 · CloudEvent</text>
  <text x="90" y="720" font-size="18" fill="#e6e0d6">parses official NBA injury PDF</text>

  <!-- Cloud Scheduler (infra / purple) -->
  <rect x="555" y="640" width="390" height="94" rx="14" fill="#6D5BD8"/>
  <text x="575" y="673" font-size="25" font-weight="bold" fill="#ffffff">Cloud Scheduler</text>
  <text x="575" y="698" font-size="18" fill="#e6e0d6">hourly injury Pub/Sub topic</text>
  <text x="575" y="720" font-size="18" fill="#e6e0d6">cron hits /check_games settle</text>

  <!-- OpenAI API (external / red) -->
  <rect x="1030" y="88" width="310" height="118" rx="14" fill="#B34A3E"/>
  <text x="1050" y="121" font-size="25" font-weight="bold" fill="#ffffff">OpenAI API</text>
  <text x="1050" y="148" font-size="18" fill="#e6e0d6">o4-mini vision — OCR of</text>
  <text x="1050" y="170" font-size="18" fill="#e6e0d6">PrizePicks screenshots</text>
  <text x="1050" y="192" font-size="18" fill="#e6e0d6">gpt-4o-mini explainer</text>

  <!-- NBA / ESPN (external / red) -->
  <rect x="1030" y="236" width="310" height="118" rx="14" fill="#B34A3E"/>
  <text x="1050" y="269" font-size="25" font-weight="bold" fill="#ffffff">NBA / ESPN APIs</text>
  <text x="1050" y="296" font-size="18" fill="#e6e0d6">stats.nba.com game logs</text>
  <text x="1050" y="318" font-size="18" fill="#e6e0d6">ScoreboardV2, box scores</text>
  <text x="1050" y="340" font-size="18" fill="#e6e0d6">espn.com live scoreboard</text>

  <!-- PrizePicks Cron (app / green) -->
  <rect x="1030" y="470" width="310" height="118" rx="14" fill="#0E9F7A"/>
  <text x="1050" y="503" font-size="25" font-weight="bold" fill="#ffffff">PrizePicks Cron</text>
  <text x="1050" y="530" font-size="18" fill="#e6e0d6">local_runner.py 12:05AM</text>
  <text x="1050" y="552" font-size="18" fill="#e6e0d6">api.prizepicks.com feed</text>
  <text x="1050" y="574" font-size="18" fill="#e6e0d6">GCP IPs bot-blocked</text>

  <!-- +EV Arb Scanner (app / green) -->
  <rect x="1030" y="618" width="310" height="118" rx="14" fill="#0E9F7A"/>
  <text x="1050" y="651" font-size="25" font-weight="bold" fill="#ffffff">+EV Arb Scanner</text>
  <text x="1050" y="678" font-size="18" fill="#e6e0d6">The-Odds-API v4 de-vig</text>
  <text x="1050" y="700" font-size="18" fill="#e6e0d6">consensus edge ≥ 2%</text>
  <text x="1050" y="722" font-size="18" fill="#e6e0d6">SQLite ev_results.db</text>

  <!-- ===== Arrows ===== -->
  <!-- SPA -> Hosting (primary) -->
  <line x1="300" y1="204" x2="300" y2="297" stroke="#E8A838" stroke-width="3" marker-end="url(#mGold)"/>
  <text x="316" y="258" font-size="17" fill="#cfc9bf">SPA assets, /api rewrite</text>

  <!-- SPA -> Flask (primary) -->
  <line x1="455" y1="204" x2="653" y2="298" stroke="#E8A838" stroke-width="3" marker-end="url(#mGold)"/>
  <text x="545" y="240" font-size="17" fill="#cfc9bf">/api/player · /parse_screenshot</text>

  <!-- SPA -> Firestore (primary, left channel) -->
  <polyline points="70,165 58,172 58,488 62,492" fill="none" stroke="#E8A838" stroke-width="3" marker-end="url(#mGold)"/>
  <text x="66" y="239" font-size="17" fill="#cfc9bf">realtime reads (JS SDK)</text>

  <!-- Flask -> OCaml (internal) -->
  <line x1="740" y1="423" x2="740" y2="462" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#mGray)"/>
  <text x="755" y="450" font-size="17" fill="#cfc9bf">ctypes FFI · 100k sims</text>

  <!-- Flask -> OpenAI (internal) -->
  <line x1="925" y1="303" x2="1022" y2="185" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#mGray)"/>
  <text x="935" y="290" font-size="17" fill="#cfc9bf" text-anchor="end">o4-mini OCR · gpt-4o-mini</text>

  <!-- Flask -> NBA/ESPN (internal) -->
  <line x1="945" y1="336" x2="1022" y2="307" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#mGray)"/>
  <text x="985" y="300" font-size="17" fill="#cfc9bf" text-anchor="middle">HTTPS</text>

  <!-- Flask -> Firestore (internal) -->
  <line x1="580" y1="423" x2="406" y2="464" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#mGray)"/>
  <text x="520" y="455" font-size="17" fill="#cfc9bf">writes processedPlayers/</text>

  <!-- Scheduler -> Injury Fn (async) -->
  <line x1="551" y1="687" x2="468" y2="687" stroke="#9a948a" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#mDash)"/>
  <text x="508" y="674" font-size="17" fill="#cfc9bf" text-anchor="middle">hourly</text>
  <text x="508" y="708" font-size="17" fill="#cfc9bf" text-anchor="middle">Pub/Sub</text>

  <!-- Scheduler -> Flask (async, right channel) -->
  <polyline points="945,665 960,658 960,415 953,411" fill="none" stroke="#9a948a" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#mDash)"/>
  <text x="860" y="631" font-size="17" fill="#cfc9bf" text-anchor="middle">GET /check_games</text>

  <!-- Injury Fn -> Firestore (async) -->
  <line x1="250" y1="637" x2="250" y2="596" stroke="#9a948a" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#mDash)"/>
  <text x="238" y="620" font-size="17" fill="#cfc9bf" text-anchor="end">injury_report/{team}</text>

  <!-- PrizePicks Cron -> Firestore (async, bottom channel) -->
  <polyline points="1030,535 992,545 992,600 430,600 430,596" fill="none" stroke="#9a948a" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#mDash)"/>
  <text x="600" y="622" font-size="17" fill="#cfc9bf" text-anchor="middle">daily write → preproccessed_data/</text>

  <!-- Scanner -> Cron (internal) -->
  <line x1="1090" y1="616" x2="1090" y2="596" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#mGray)"/>
  <text x="1120" y="611" font-size="17" fill="#cfc9bf">same residential IP</text>

  <!-- ===== Legend ===== -->
  <line x1="70" y1="880" x2="130" y2="880" stroke="#E8A838" stroke-width="3" marker-end="url(#mGold)"/>
  <text x="145" y="886" font-size="17" fill="#cfc9bf">primary user flow</text>
  <line x1="420" y1="880" x2="480" y2="880" stroke="#b0aaa0" stroke-width="2.5" marker-end="url(#mGray)"/>
  <text x="495" y="886" font-size="17" fill="#cfc9bf">internal data flow</text>
  <line x1="780" y1="880" x2="840" y2="880" stroke="#9a948a" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#mDash)"/>
  <text x="855" y="886" font-size="17" fill="#cfc9bf">async / scheduled job</text>
</svg>